name: Build APK from ZIP
on:
  push:
  workflow_dispatch:
env:
  GODOT_VERSION: "4.3"
jobs:
  android:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          echo "Found: $ZIP"
          mkdir -p unpacked
          unzip -q -o "$ZIP" -d unpacked
          PROJ=$(dirname $(find unpacked -name project.godot | head -n 1))
          echo "PROJ=$PROJ" >> $GITHUB_ENV
      - name: Setup Godot and Android
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          [ -f /root/debug.keystore ] || keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /root/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          JAVA_DIR=$(dirname $(dirname $(readlink -f $(which javac))))
          SDK_DIR=${ANDROID_HOME:-/usr/lib/android-sdk}
          F=~/.config/godot/editor_settings-4.3.tres
          echo '[gd_resource type="EditorSettings" format=3]' > $F
          echo '[resource]' >> $F
          echo "export/android/java_sdk_path = \"$JAVA_DIR\"" >> $F
          echo "export/android/android_sdk_path = \"$SDK_DIR\"" >> $F
          echo 'export/android/debug_keystore = "/root/debug.keystore"' >> $F
          echo 'export/android/debug_keystore_user = "androiddebugkey"' >> $F
          echo 'export/android/debug_keystore_pass = "android"' >> $F
          cp $F ~/.config/godot/editor_settings-4.tres
          cat $F
      - name: Install Android build tools
        run: |
          SDK_DIR=${ANDROID_HOME:-/usr/lib/android-sdk}
          SDKM=$(find / -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKM" ]; then
            curl -sSL -o /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p $SDK_DIR/cmdline-tools
            unzip -q /tmp/ct.zip -d $SDK_DIR/cmdline-tools
            SDKM=$SDK_DIR/cmdline-tools/cmdline-tools/bin/sdkmanager
          fi
          echo "sdkmanager: $SDKM"
          yes | $SDKM --sdk_root=$SDK_DIR --licenses > /dev/null || true
          $SDKM --sdk_root=$SDK_DIR "build-tools;34.0.0" "platforms;android-34" "platform-tools"
          if [ ! -e $SDK_DIR/cmdline-tools/latest/bin/sdkmanager ]; then
            $SDKM --sdk_root=$SDK_DIR "cmdline-tools;latest" || true
          fi
          if [ ! -e $SDK_DIR/cmdline-tools/latest/bin/sdkmanager ]; then
            mkdir -p $SDK_DIR/cmdline-tools
            ln -sfn $(dirname $(dirname $SDKM)) $SDK_DIR/cmdline-tools/latest
          fi
          ls $SDK_DIR $SDK_DIR/build-tools $SDK_DIR/cmdline-tools
          ls $SDK_DIR/cmdline-tools/latest/bin
          ls $SDK_DIR/platform-tools | head
      - name: Check export templates
        run: |
          echo "HOME=$HOME"
          T=$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $T
          ls -la $HOME/.local/share/godot/export_templates/ || true
          ls /root/.local/share/godot/export_templates/ || true
          if [ ! -f $T/android_debug.apk ]; then
            echo "android_debug.apk missing in $T, searching..."
            FOUND=$(find / -name android_debug.apk -not -path "$T/*" 2>/dev/null | head -n 1)
            if [ -n "$FOUND" ]; then
              cp -r $(dirname $FOUND)/. $T/
            else
              echo "Downloading official export templates..."
              curl -sSL -o /tmp/t.tpz https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
              unzip -q /tmp/t.tpz -d /tmp/tpl
              cp -r /tmp/tpl/templates/. $T/
            fi
          fi
          echo "${GODOT_VERSION}.stable" > $T/version.txt
          ls -la $T | head -30
      - name: Export APK
        working-directory: ${{ env.PROJ }}
        run: |
          mkdir -p build
          godot --headless --import || true
          godot --headless --verbose --export-debug "Android" build/CoupleChef.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CoupleChef-apk
          path: ${{ env.PROJ }}/build/CoupleChef.apk
